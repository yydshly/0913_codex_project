<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1550" viewBox="0 0 2600 1550" font-family="Microsoft YaHei, sans-serif" role="img" aria-label="西安景区受控合成，右侧为城区独立放大"><rect width="2600" height="1550" fill="#f6f1e3"/><text x="80" y="102" font-size="52" fill="#334c3b" >西安与周边 · 景区合成实验</text><text x="82" y="155" font-size="25" fill="#334c3b" >位置由坐标确定 · 城区另幅放大 · 景区外形仍待核实</text><rect x="50" y="190" width="1710" height="1240" rx="30" fill="#eef0df" stroke="#d0d8c2"/><rect x="1810" y="190" width="740" height="1240" rx="30" fill="#fdfaf0" stroke="#d0d8c2"/><text x="1860" y="252" font-size="28" fill="#334c3b" >城区放大 · 不同比例</text><text x="1580" y="246" font-size="25" fill="#334c3b" >北 ↑</text><rect x="1107.2961680810163" y="567.9210860631875" width="71.1682079899715" height="190.5368384847386" rx="10" fill="#dce6cc" stroke="#7c9270" stroke-dasharray="7 7"/><text x="1087.2961680810163" y="545.9210860631875" font-size="25" fill="#334c3b" >城区 → 右图展开</text><circle cx="2036.3764595655427" cy="714.6896727947426" r="155" fill="#e1e8d0" fill-opacity=".5"/><text x="2036.3764595655427" y="901.6896727947426" font-size="27" fill="#334c3b" text-anchor="middle">钟楼</text><circle cx="2213.623540434457" cy="1230" r="155" fill="#e1e8d0" fill-opacity=".5"/><text x="2213.623540434457" y="1417" font-size="27" fill="#334c3b" text-anchor="middle">大雁塔</text><circle cx="2206.945503910522" cy="300" r="155" fill="#e1e8d0" fill-opacity=".5"/><text x="2206.945503910522" y="487" font-size="27" fill="#334c3b" text-anchor="middle">大明宫</text><circle cx="1132.8962012405498" cy="304.89597881037804" r="135" fill="#e1e8d0" fill-opacity=".5"/><text x="1132.8962012405498" y="471.89597881037804" font-size="27" fill="#334c3b" text-anchor="middle">汉阳陵</text><circle cx="1555.1030831013506" cy="468.9656428085141" r="50.04552057935513" fill="#e1e8d0" fill-opacity=".5"/><text x="1555.1030831013506" y="551.0111633878691" font-size="27" fill="#334c3b" text-anchor="middle">华清宫</text><circle cx="1660" cy="412.44317391
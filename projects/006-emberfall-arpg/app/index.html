<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111817"><meta name="description" content="灰烬之境：等距视角动作角色扮演游戏。探索边境与两层地下城，带战利品返回营地。"><title>灰烬之境 · EMBERFALL</title><link rel="stylesheet" href="style.css"></head>
<body>
<main id="game" aria-label="灰烬之境游戏场景">
 <canvas id="world" tabindex="0" aria-label="游戏画面，点击地面或 WASD 移动，J 攻击，空格闪避，Q 释放星陨"></canvas>
 <div class="vignette"></div>
 <header><div class="brand"><span class="sigil">✧</span><div><h1>灰烬之境</h1><span>EMBERFALL</span></div></div><div class="header-actions"><span class="chapter">第一章 <i> / </i> 余火营地</span><button id="sound" title="开关声音" aria-label="开启声音">声音：关</button><button id="world-map">地图 M</button><button id="journal" title="行囊与任务记录">行囊 B</button><button id="help" title="操作说明">操作</button><button id="pause" title="暂停游戏">暂停</button></div></header>
 <section class="quest"><div class="eyebrow">当前任务 <span id="wave">序章</span></div><h2 id="objective">唤醒沉睡的星门</h2><p id="objective-detail">靠近蓝色传送阵，按 E 开始试炼</p><div class="quest-line"><span></span></div><div id="quest-steps"></div><button id="track">前往守夜人</button><div id="route-options"><button data-route="west">林地</button><button data-route="east">采场</button><button data-route="fire">回营</button></div><div class="supplies"><span id="gold">0 余烬</span><span id="save-status">尚未保存</span></div></section>
 <aside class="map"><div class="map-title"><span>余火营地</span><span>◇</span></div><canvas id="minimap" width="180" height="150" aria-label="当前区域小地图，红点为敌人"></canvas><div class="map-footer"><span id="zone-status">余火营地</span> <span id="enemy-count">0 敌人</span></div></aside>
 <div id="notice" role="status" aria-live="polite"></div>
 <div id="boss" hidden><span>熔心领主</span><div><i></i></div></div>
 <button id="prompt">E · 与附近人物交谈</button>
 <footer class="hud"><div class="orb-wrap"><div class="orb health"><div id="hp-fluid"></div><span>生命</span><strong id="hp">100</strong></div><small id="hp-max">100 / 100</small></div><div class="skills"><div class="player-info"><span>流浪剑士 <b id="level">Lv. 1</b></span><span id="kills">0 击败</span></div><div class="skill-row"><button class="skill" data-action="attack"><kbd>J / 右键</kbd><span class="skill-icon">⚔</span><span>斩击</span><em></em></button><button class="skill" data-action="dash"><kbd>SPACE</kbd><span class="skill-icon">➶</span><span>闪避</span><em></em></button><button class="skill blue" data-action="nova"><kbd>Q</kbd><span class="skill-icon">✧</span><span>星陨</span><em></em></button><button class="skill green" data-action="potion"><kbd>R</kbd><span class="skill-icon">♜</span><span id="potions">药剂 × 3</span><em></em></button></div><div class="xp-track"><i id="xp"></i></div><div class="hud-hint">WASD 移动 <b>·</b> E 交互 <b>·</b> ESC 暂停</div></div><div class="orb-wrap"><div class="orb mana"><div id="mp-fluid"></div><span>法力</span><strong id="mp">100</strong></div><small id="mp-max">100 / 100</small></div></footer>
 <div class="touch-controls"><div id="stick"><i></i></div><button id="interact">交互 E</button></div>
 <dialog id="modal"><div class="modal-mark">✧</div><p class="eyebrow">EMBERFALL</p><h2 id="modal-title">余火营地</h2><div id="modal-body"></div><div id="modal-actions"></div><button id="modal-primary">继续旅程</button></dialog>
 <div id="loading"><span>✧</span><p>正在点燃余火…</p></div>
</main><script type="module" src="game.js"></script>
</body></html>

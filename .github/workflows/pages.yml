name: Deploy research site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/001-paperroute/app/package-lock.json
      - name: Install project dependencies
        run: npm ci --prefix projects/001-paperroute/app
      - name: Verify game rules
        run: node --test projects/001-paperroute/app/game-state.test.mjs
      - name: Verify material layout and upstream prompt checker
        run: |
          node --test projects/002-dunhuang-aura/app/studio-layout.test.mjs
          python3 -m unittest discover -s projects/002-dunhuang-aura/app/validator/tests -v
      - name: Verify railway scene rules
        run: node --test projects/003-mountain-railway-diorama/app/model.test.mjs projects/003-mountain-railway-diorama/app/scene.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build all static projects
        run: node scripts/build-site.mjs
      - name: Check published resources and navigation
        run: node scripts/check-site.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

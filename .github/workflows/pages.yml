name: Deploy research site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            projects/011-frontend-visual-lab/app/package-lock.json
            projects/009-city-landmark-map/app/package-lock.json
            projects/001-paperroute/app/package-lock.json
            projects/005-stick-steel/app/client/package-lock.json
      - name: Install project dependencies
        run: |
          npm ci --prefix projects/009-city-landmark-map/app
          npm ci --prefix projects/011-frontend-visual-lab/app
          npm ci --prefix projects/001-paperroute/app
          npm ci --prefix projects/005-stick-steel/app/client
      - name: Verify game rules
        run: node --test projects/001-paperroute/app/game-state.test.mjs
      - name: Verify material layout and upstream prompt checker
        run: |
          node --test projects/002-dunhuang-aura/app/studio-layout.test.mjs
          python3 -m unittest discover -s projects/002-dunhuang-aura/app/validator/tests -v
      - name: Verify railway scene rules
        run: node --test projects/003-mountain-railway-diorama/app/*.test.mjs
      - name: Verify motorcycle driving rules
        run: node --test projects/010-mini-moto-comparison/app/model.test.mjs projects/010-mini-moto-comparison/app/ride.test.mjs
      - name: Verify character, story, physics and cached audio
        run: |
          npm run typecheck --prefix projects/005-stick-steel/app/client
          npm test --prefix projects/005-stick-steel/app/client
          npm run test:audio --prefix projects/005-stick-steel/app/client
      - name: Verify weather and courtyard rules
        run: node --test projects/004-eanpa-sky/app/lab/*.test.mjs
      - name: Verify terrain, surface, forest and immutable snapshots
        run: |
          npm test --prefix projects/008-terrain-motion-lab/app
          node projects/008-terrain-motion-lab/app/snapshot.mjs verify v001
          node projects/008-terrain-motion-lab/app/snapshot.mjs verify v002
          node projects/008-terrain-motion-lab/app/snapshot.mjs verify v003
      - name: Verify city atlas evidence and composition rules
        run: npm test --prefix projects/009-city-landmark-map/app
      - name: Verify Whistlevale comparison and gallery
        run: |
          node --test projects/012-whistlevale/app/webgl-math.test.mjs projects/012-whistlevale/app/renderer-compare.test.mjs
          node projects/012-whistlevale/app/check.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install 006 research document renderer
        run: python3 -m pip install -r projects/006-emberfall-arpg/app/requirements-research.txt
      - name: Build all static projects
        run: node scripts/build-site.mjs
      - name: Check published resources and navigation
        run: |
          node scripts/check-site.mjs
          npm run test:pages --prefix projects/011-frontend-visual-lab/app
          npm run check --prefix projects/009-city-landmark-map/app
          npm run check --prefix projects/008-terrain-motion-lab/app
          node projects/005-stick-steel/app/check.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

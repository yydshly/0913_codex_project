    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#163d4a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" rx="20" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
